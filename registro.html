<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <section class="min-vh-100 bg-light p-4 d-flex align-items-center justify-content-center">
        
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="card text-black">
                        <div class="card-body p-2 p-md-5">
                            <p class="text-center">
                                <img class="logo" src="images/logoColor.svg" alt="">
                            </p>
                            
                            <h1 class="text-center h3 fw-bold mb-5 mt-4">Registrate</h1>
                            
                            <form class="mx-1 mx-md-4">
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control" id="nombre" placeholder=" " />
                                    <label for="nombre">Nombre</label>
                                </div>
                                
                                <div class="form-floating mb-3">
                                    <input type="email" class="form-control" id="email" placeholder=" " />
                                    <label for="email">Correo electrónico</label>
                                </div>
                                
                                <div class="form-floating mb-3">
                                    <input type="password" class="form-control" id="constrasena" placeholder=" " />
                                    <label for="constrasena">Contraseña</label>
                                </div>
                                
                                <div class="form-floating mb-3">
                                    <input type="password" class="form-control" id="repetir" placeholder=" " />
                                    <label for="repetir">Repita su contraseña</label>
                                </div>
                                
                                <a href="./index.html" class="w-100 btn btn-primary"> Registrarse </a>
                            </form>

                            <p class="mt-5 mb-0 text-center">Ya tengo una cuenta. <a href="./login.html" class="link-success text-decoration-none">Iniciar sesión</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
