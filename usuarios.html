<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unisys Nova</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    
    <main class="bg-light min-vh-100">
        <header>
            <nav class="navbar navbar-expand-md bg-primary navbar-dark">
                <div class="container-fluid">
                    <a class="navbar-brand" href="./index.html">
                        <img src="./images/logo.svg" alt="Logo">
                    </a>
                    
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    
                    <div class="collapse navbar-collapse flex-grow-0" id="navbarNav">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link" aria-current="page" href="./index.html">Inicio</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="./proyectos.html">Proyectos</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" href="./usuarios.html">Usuarios</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>
        
        <div class="p-4">
            <div class="container">
                <h1 class="h3 mb-4">Crear usuarios</h1>
                
                <form>
                    <div class="row g-4">
                        <div class="col-lg-4">
                            <div class="form-floating">
                                <input type="number" class="form-control" id="documento" placeholder=" " />
                                <label for="documento">Documento</label>
                            </div>
                        </div>
                        
                        <div class="col-lg-4">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="nombres" placeholder=" " />
                                <label for="nombres">Nombres</label>
                            </div>
                        </div>
                        
                        <div class="col-lg-4">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="apellidos" placeholder=" " />
                                <label for="apellidos">Apellidos</label>
                            </div>
                        </div>
                        
                        <div class="col-lg-4">
                            <div class="form-floating">
                                <input type="email" class="form-control" id="correo" placeholder=" " />
                                <label for="correo">Correo electrónico</label>
                            </div>
                        </div>
                        
                        <div class="col-lg-4">
                            <div class="form-floating">
                                <input type="number" class="form-control" id="telefono" placeholder=" " />
                                <label for="telefono">Teléfono</label>
                            </div>
                        </div>
                        
                        <div class="col-lg-4">
                            <div class="form-floating">
                                <select type="text" class="form-control form-select" id="estado">
                                    <option value="">Seleccione un rol</option>
                                    <option value="Administrador">Administrador</option>
                                    <option value="Coordinador">Coordinador</option>
                                    <option value="Docente">Docente</option>
                                    <option value="Estudiante">Estudiante</option>
                                    <option value="Investigador">Investigador</option>
                                    <option value="Asistente">Asistente</option>
                                    <option value="Invitado">Invitado</option>
                                </select>
                                <label for="estado">Rol sistema</label>
                            </div>
                        </div>
                        
                        <div class="col-12">
                            <div class="d-flex justify-content-end">
                                <a href="./index.html" class="btn btn-primary">Crear usuario</a>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
