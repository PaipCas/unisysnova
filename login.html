<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unisys Nova</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <main>
        <section class="container-fluid">
            <div class="row min-vh-100">
                <div class="col-md-6">
                    <div class="justify-content-between p-2 p-md-4 d-flex flex-column h-100">
                        <img class="logo" src="./images/logoColor.svg" alt="logo" />
                        
                        <div class="row justify-content-center">
                            <div class="col-lg-7">
                                <p class="mb-1">Bienvenidos a Unisys Nova</p>
                                <h1 class="mb-4">Iniciar Sesión</h1>
                                
                                <form>
                                    <div class="form-floating mb-3">
                                        <input type="email" class="form-control" id="email" placeholder=" " />
                                        <label for="email">Correo electrónico</label>
                                    </div>
                                    
                                    <div class="form-floating mb-3">
                                        <input type="password" class="form-control" id="password" placeholder=" " />
                                        <label for="password">Contraseña</label>
                                    </div>
                                    
                                    <a href="./index.html" class="w-100 btn btn-primary"> Iniciar Sesión </a>
                                    
                                    <p class="mt-4 text-center">Registrate con</p>
                                    
                                    <div class="redes d-flex gap-3">
                                        <a href="https://www.facebook.com/" class="flex-grow-1 btn btn-light" target="_blank">
                                            <img src="images/facebook.png" alt="facebook">
                                        </a>
                                        
                                        <a href="https://www.gmail.com" class="flex-grow-1 btn btn-light" target="_blank">
                                            <img src="images/gmail.png" alt="gmail">
                                        </a>
                                    </div>
                                </form>
                            </div>
                        </div>
                        
                        <p>Registrate <a href="./registro.html" class="link-success text-decoration-none">aqui</a></p>
                    </div>
                </div>
                
                <div class="col-md-6 p-0">
                    <div id="carouselExampleIndicators" class="h-100 carousel slide">
                        <div class="carousel-indicators">
                            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
                        </div>
                        <div class="carousel-inner">
                            <div class="carousel-item active">
                                <img src="images/carrusel-1.jpg" class="d-block w-100 vh-100 object-fit-cover" alt="...">
                            </div>
                            <div class="carousel-item">
                                <img src="images/universidad.jpg" class="d-block w-100 vh-100 object-fit-cover" alt="...">
                            </div>
                        </div>  
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
